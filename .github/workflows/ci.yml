name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # keep in sync with the Dockerfile base image
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
